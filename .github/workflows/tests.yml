name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # The suite pins its own environment in tests/conftest.py, so no .env
        # and no secrets are needed — and none are available to a fork's PR.
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real bot token was committed
        run: |
          # A Telegram token looks like 1234567890:AA... — the placeholder in
          # .env.example is deliberately shorter and is excluded.
          if git grep -nIE '[0-9]{9,10}:AA[A-Za-z0-9_-]{32,}' -- \
               ':!.env.example' ':!.github' ; then
            echo "::error::A bot token appears to be committed. Revoke it in @BotFather and purge it from history."
            exit 1
          fi
          echo "No committed bot token found."

      - name: Fail if .env was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. It must stay ignored."
            exit 1
          fi
          echo ".env is not tracked."
